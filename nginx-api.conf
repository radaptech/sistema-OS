# Incluído pelo nginx.conf.template do front só na imagem única (dockerfile da
# raiz): repassa /api para o binário Go no mesmo container.
location /api {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;

    # Repassa o X-Forwarded-For do Railway como chegou, sem somar o IP dele. A API
    # só confia em 127.0.0.1 e pega o último IP da lista, que é o que o proxy do
    # Railway escreveu -- o cliente real. Somar o $remote_addr aqui faria a API
    # enxergar o IP do proxy do Railway como cliente.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Vídeo do defeito vai até 40MB (bucketR2.TamanhoMaximoComVideo); o padrão do
    # nginx é 1MB e recusaria antes da API.
    client_max_body_size 50m;
}
