# Incluído pelo nginx.conf.template do front só na imagem única (dockerfile da
# raiz): repassa /api para o binário Go no mesmo container.
location /api {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;

    # IP do cliente: só o X-Real-IP, que a borda do Railway SOBRESCREVE em toda
    # requisição (inclusive se o cliente mandar o dele). O X-Forwarded-For não
    # serve: chega como "cliente, IP-da-borda-do-Railway", e a API, pegando o último,
    # via a borda -- todo mundo atrás da mesma borda dividia o limite de login.
    # Esvaziado aqui, o Gin cai no X-Real-IP (a API só confia em 127.0.0.1).
    # Sem X-Real-IP (não deveria acontecer) o IP vira 127.0.0.1: limite
    # compartilhado, nunca um IP forjado pelo cliente.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Vídeo do defeito vai até 40MB (bucketR2.TamanhoMaximoComVideo); o padrão do
    # nginx é 1MB e recusaria antes da API.
    client_max_body_size 50m;
}
