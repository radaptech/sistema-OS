name: Back-end

# Monorepo: só roda quando o back (ou este arquivo) muda.
on:
  push:
    branches: [master, dev]
    paths: ['sistema-OSm--Back-end/**', '.github/workflows/back-end.yml']
  pull_request:
    paths: ['sistema-OSm--Back-end/**', '.github/workflows/back-end.yml']
  # Rodar à mão pela aba Actions.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # O teste de integração dá t.Skip sem Postgres alcançável -- sem este
    # service o CI passaria verde sem ter rodado a metade que importa.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: sistema-OSm--Back-end

    env:
      TEST_DB_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sistema-OSm--Back-end/go.mod
          cache-dependency-path: sistema-OSm--Back-end/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...
