services:

  # Proxy reverso. Serve front e API na MESMA origem (http://<tenant>.localhost:8090):
  # /api vai pro back-end, todo o resto pro Vite. Mesma origem é requisito, não estética
  # -- o cookie de sessão é SameSite=Lax e "a.localhost" e "b.localhost" são sites
  # diferentes pro browser, então front e API em subdomínios distintos não trocariam
  # cookie em dev.
  #
  # Portas 8090/8091 porque 80 e 8080 são do traefik do projeto sgeepi-infra.
  # Os dois traefik enxergam o mesmo socket do Docker, então este aqui:
  #   - só aceita containers deste compose (constraint no label de projeto);
  #   - usa um entrypoint de nome próprio ("websos"), que não existe no outro traefik --
  #     routers apontando pra entrypoint inexistente são descartados lá, então os labels
  #     abaixo não vazam pro projeto vizinho.
  traefik:
    image: traefik:v3
    container_name: traefik_sistema-OS
    restart: always
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=sistema-os_default"
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`sistema-os`)"
      - "--entrypoints.websos.address=:80"
    ports:
      - "8090:80"    # entrada da aplicação
      - "8091:8080"  # dashboard do traefik (dev; --api.insecure não vai pra produção)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      default:
        # IP fixo só pra existir o que declarar em TRUSTED_PROXIES da api.
        ipv4_address: 172.29.0.2

  postgres:
    image: postgres:16-alpine
    container_name: postgres_container-sistema-OS
    restart: always  
    ports:
      - "5431:5431"
    environment:
      - TZ=America/Sao_Paulo
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sistema-OS
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema-OS"]
      interval: 5s
      timeout: 5s
      retries: 5


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container-sistema-OS
    restart: always
    ports:
      - "5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    depends_on:
      - postgres


  # Estado da Evolution API (sessão/instância do WhatsApp) -- banco e cache
  # próprios, separados do banco da aplicação de propósito: não é dado do
  # domínio, é estado interno de uma peça de infra que pode ser trocada.
  evolution-postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres_container-sistema-OS
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution
      - POSTGRES_DB=evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution_redis_container-sistema-OS
    restart: always
    volumes:
      - evolution_redis_data:/data

  # WhatsApp não-oficial (protocolo do WhatsApp Web, lib Baileys) pra
  # notificar Gestor/Técnico quando uma Solicitação abre -- ver
  # back-end/CLAUDE.md, "Notificação de solicitação por WhatsApp". Fica
  # pronto pra usar: falta só comprar o chip dedicado e escanear o QR
  # (POST /instance/connect) quando ele chegar -- nenhum código do backend
  # depende disto rodando ainda.
  #
  # AUTHENTICATION_API_KEY aqui é valor de dev, igual postgres/postgres
  # acima -- gere um de verdade (openssl rand -base64 32) antes de subir em
  # produção, e troque também no .env do back-end (EVOLUTION_API_KEY),
  # onde o NotificacaoService vai ler pra autenticar as chamadas.
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api_container-sistema-OS
    restart: on-failure:5
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      - AUTHENTICATION_API_KEY=evolution-dev-key-troque-em-producao
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/6
      - CACHE_LOCAL_ENABLED=false
      # Localhost serve pra dev: só usada por webhook/callback interno da
      # própria Evolution API, e o backend não expõe rota nenhuma pra ela
      # chamar de volta ainda. Revisitar quando for pra produção (Railway).
      - SERVER_URL=http://localhost:8092
    ports:
      - "8092:8080"
    volumes:
      - evolution_instances:/evolution/instances

  api:
    container_name: api_sistema-OS
    restart: on-failure:5
    build:
      context: ./sistema-OSm--Back-end
      dockerfile: dockerfile.dev
    # Propriedades movidas para o nível correto do serviço:
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./sistema-OSm--Back-end/.env
    environment:
      # Só o traefik pode ditar o X-Forwarded-For; de resto o ClientIP é o IP da
      # conexão. Sem isto o rate limit do login cai com um header forjado.
      # Em produção: o endereço do proxy do Railway, não este.
      - TRUSTED_PROXIES=172.29.0.2/32
    volumes:
      - ./sistema-OSm--Back-end:/app
    # Sem "ports": quem publica é o traefik. Prioridade alta pra /api ganhar do
    # catch-all do front.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.os-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.os-api.entrypoints=websos"
      - "traefik.http.routers.os-api.priority=100"
      - "traefik.http.services.os-api.loadbalancer.server.port=8081"


  front:
    image: node:22-alpine
    container_name: front_sistema-OS
    restart: on-failure:5
    working_dir: /app
    # --host 0.0.0.0 pro Vite aceitar conexão de fora do container. O Vite já libera
    # *.localhost por padrão, então o subdomínio do tenant passa sem allowedHosts.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      # Mesma origem: api.ts monta /api/... em cima do host que serviu a página, e é
      # window.location.hostname que vira o X-tenant-ID. Um valor absoluto aqui fixaria
      # um tenant só.
      - REACT_APP_URL_API=/api
      - VITE_USE_MOCKS=false
    volumes:
      - ./sistema-OSm--Front-end:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.os-front.rule=PathPrefix(`/`)"
      - "traefik.http.routers.os-front.entrypoints=websos"
      - "traefik.http.routers.os-front.priority=1"
      - "traefik.http.services.os-front.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_instances:

# Sub-rede declarada (172.29 estava livre) só pra o traefik poder ter IP fixo --
# ver TRUSTED_PROXIES na api.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/16